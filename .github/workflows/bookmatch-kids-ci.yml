name: bookmatch-kids CI

on:
  push:
    branches: [Main]
    paths:
      - "bookmatch-kids/**"
      - ".github/workflows/bookmatch-kids-ci.yml"
  pull_request:
    paths:
      - "bookmatch-kids/**"
      - ".github/workflows/bookmatch-kids-ci.yml"

defaults:
  run:
    working-directory: bookmatch-kids

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: bookmatch-kids/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Placeholders so next build doesn't fail on missing envs.
          # Real values are injected at deploy time by Vercel.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          ANTHROPIC_API_KEY: placeholder
